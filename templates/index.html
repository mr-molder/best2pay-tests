<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Best2Pay Инструменты</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="main-container">
        <h1>Best2Pay Инструменты</h1>

        <div class="tabs">
            <button class="tab-button active" onclick="showTab(0)">Донастройка секторов</button>
            <button class="tab-button" onclick="showTab(1)">Тестирование</button>
            <button class="tab-button" onclick="showTab(2)">Шаблон выдачи</button>
        </div>

        <!-- ВКЛАДКА 0: ДОНАСТРОЙКА СЕКТОРОВ -->
        <div id="tab-0" class="tab-content active">
            <h2>Генератор запроса на донастройку секторов</h2>
            <form id="dona-mainForm">
                <label for="dona-requestTitle">Заголовок запроса:</label>
                <input type="text" id="dona-requestTitle" value="Просьба донастроить сектора" required>

                <label for="dona-login">Логин:</label>
                <input type="text" id="dona-login" placeholder="Например: miamoney.ru" required>

                <button type="button" id="dona-addSectorButton">Добавить сектор</button>
            </form>

            <div id="dona-sectorsList"></div>

            <button type="button" id="dona-generateButton">Сгенерировать текст</button>
            <button type="button" id="dona-copyButton" style="display: none;">Копировать текст</button>

            <div id="dona-output"></div>
        </div>

        <!-- ВКЛАДКА 1: ТЕСТИРОВАНИЕ -->
        <div id="tab-1" class="tab-content">
            <h2>Тестирование Best2Pay</h2>
            
            <!-- Новая секция: выбор сектора из донастройки -->
            <div style="margin-bottom: 20px; border: 1px solid #ccc; padding: 10px; border-radius: 5px;">
                <h3>Тестирование секторов из донастройки</h3>
                <div>
                    <label>Выберите сектор:</label>
                    <select id="donaSectorSelect">
                        <option value="">-- выберите сектор --</option>
                    </select>
                </div>
                <div id="handlesForTest" style="margin-top: 10px;"></div>
                <div style="margin-top: 10px;">
                    <label>Пароль:</label>
                    <input type="password" id="testPassword" placeholder="Пароль для подписи">
                </div>
                <!-- +++ ДОБАВЛЕН ВЫБОР АЛГОРИТМА +++ -->
                <div style="margin-top: 10px;">
                    <label>Алгоритм подписи:</label>
                    <select id="testAlgorithm">
                        <option value="sha256" selected>SHA256</option>
                        <option value="md5">MD5</option>
                    </select>
                </div>
                <!-- +++ КОНЕЦ ДОБАВЛЕНИЯ +++ -->
                <button type="button" id="runSelectedHandlesBtn">Запустить тесты для выбранных ручек</button>
                <div id="testProgress" style="margin-top: 10px; font-family: monospace;"></div>
            </div>

            <hr>

            <!-- Существующая форма ручного тестирования -->
            <h3>Ручное тестирование</h3>
            <form id="testForm">
                <div><label>Сектор (ID):</label><input type="text" id="sector" required placeholder="Например: 1"></div>
                <div><label>Пароль:</label><input type="password" id="password" required placeholder="Пароль для подписи"></div>
                <div><label>Алгоритм подписи:</label>
                    <select id="algorithm">
                        <option value="sha256" selected>SHA256</option>
                        <option value="md5">MD5</option>
                    </select>
                </div>
                <div><label>Сценарий:</label>
                    <select id="scenario" required>
                        {% for key, sc in scenarios.items() %}
                        <option value="{{ key }}">{{ sc.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <button type="button" onclick="runTest()">Начать тестирование</button>
            </form>
            <h3>Результат:</h3>
            <pre id="tester-output" class="output">(ожидание запуска...)</pre>
        </div>

        <!-- ВКЛАДКА 2: ШАБЛОН ВЫДАЧИ -->
        <div id="tab-2" class="tab-content">
            <h2>Шаблон выдачи</h2>
            <form id="generatorForm">
                <label for="accessType">Тип доступа:</label>
                <select id="accessType" required>
                    <option value="combat">Боевой</option>
                    <option value="test">Тестовый</option>
                </select>

                <label for="login">Login:</label>
                <input type="text" id="login" placeholder="Например: finmi.ru или plata" required>

                <label for="hashType">Тип хэша:</label>
                <select id="hashType" required>
                    <option value="sha256">sha256</option>
                    <option value="md5">md5</option>
                </select>

                <label for="sectors">Список секторов (каждый с новой строки):</label>
                <textarea id="sectors" rows="10" placeholder="Sector ID: 24094 ООО МКК &quot;Финкомпас&quot; (finmi.ru) (СМЭВ) (БП)..." required></textarea>

                <button type="button" id="generateButton">Сгенерировать текст</button>
                <button type="button" id="copyButton">Копировать текст</button>
                <button type="button" id="loadFromDonaBtn" style="margin-left: 10px;">Загрузить из донастройки</button>
            </form>
            <textarea id="generator-output" class="output" readonly></textarea>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО (общее для вкладки 0) -->
    <div id="modal">
        <div id="modal-content">
            <span class="close">&times;</span>
            <h2 id="modalTitle">Добавить сектор</h2>
            <form id="sectorForm">
                <label for="sectorData">Данные сектора:</label>
                <input type="text" id="sectorData" placeholder="9050 ООО МКК Кальмия (miamoney.ru) (СБП) (ФЛ) или ..." required>
                <div class="form-hint">Можно с префиксом "Sector ID:" или без.</div>

                <button type="button" id="parseSectorDataBtn">Разобрать строку</button>

                <label for="sectorType">Тип сектора:</label>
                <select id="sectorType" required>
                    <option value="SMEV">СМЭВ</option>
                    <option value="P2PCredit">P2PCredit</option>
                    <option value="SBPCredit">SBPCredit</option>
                    <option value="Out">Out</option>
                    <option value="In">In</option>
                    <option value="In_FL">In (ФЛ)</option>
                    <option value="Token">Token</option>
                    <option value="SBP Token">SBP Token</option>
                    <option value="A2C">A2C</option>
                    <option value="C2A_FL">C2A (ФЛ)</option>
                    <option value="SBP_FL">СБП (ФЛ)</option>
                </select>

                <label for="hasCommission">Есть комиссия?</label>
                <input type="checkbox" id="hasCommission">

                <div id="commissionDetails" class="hidden">
                    <div class="commission-type-group">
                        <label><input type="radio" name="commissionType" value="fix" checked> Фиксированная (процент + фикс)</label>
                        <label><input type="radio" name="commissionType" value="min"> Минимальная (процент + минимум)</label>
                    </div>

                    <label for="commissionPercent">Процент комиссии:</label>
                    <input type="number" id="commissionPercent" min="0" step="any" placeholder="0">

                    <div id="fixField">
                        <label for="commissionFix">Фикс (руб):</label>
                        <input type="number" id="commissionFix" min="0" step="any" placeholder="0">
                    </div>

                    <div id="minField" class="hidden">
                        <label for="commissionMin">Минимум (руб):</label>
                        <input type="number" id="commissionMin" min="0" step="any" placeholder="0">
                    </div>
                    <div class="form-hint" id="commissionHint"></div>
                </div>

                <h3>Ручки:</h3>
                <div id="handles"></div>

                <h3>Настройки:</h3>
                <div id="settings"></div>

                <button type="button" id="modalActionBtn">Добавить в список</button>
                <div id="modal-error" class="error-message"></div>
            </form>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
